plugins {
    id 'com.android.application'
}

android {
    namespace 'org.photocraft.android'
    compileSdk 35

    defaultConfig {
        applicationId 'org.photocraft.android'
        // Vulkan 1.1 is common from Android 9; older devices fall back to GLES 3.
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.8.2-android'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs straight away; use your own keystore
            // before publishing anywhere.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // libphotocraft_android.so is built by cargo-ndk into src/main/jniLibs (see ../build.sh).
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}
